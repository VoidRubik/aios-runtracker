<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RunTracker</title>
<style>
  :root {
    --bg: #0b0d10;
    --card: #15181d;
    --line: #262b33;
    --text: #eef1f5;
    --dim: #8b93a1;
    --accent: #4ade80;
    --accent-dim: #1e5c3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 64px;
  }
  main { width: 100%; max-width: 480px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 20px;
    letter-spacing: -0.02em;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .stat-label {
    font-size: 12px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 4px;
  }
  .stat-value {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-value small { font-size: 14px; color: var(--dim); font-weight: 500; }
  #status {
    font-size: 13px;
    color: var(--dim);
    margin-top: 14px;
    min-height: 18px;
  }
  #status.error { color: #f87171; }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:active { opacity: .8; }
  #toggle { background: var(--accent); color: #05130a; }
  #toggle.running { background: #f87171; color: #2a0a0a; }
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-head button {
    width: auto;
    margin: 0;
    padding: 6px 12px;
    background: var(--line);
    color: var(--text);
    font-size: 14px;
  }
  .cal-title { font-weight: 700; font-size: 15px; }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    text-align: center;
  }
  .cal-dow { font-size: 11px; color: var(--dim); padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 13px;
    color: var(--dim);
  }
  .cal-day.ran {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 700;
  }
  .cal-day.today { outline: 1px solid var(--dim); }
  .cal-day.empty { visibility: hidden; }
  .history-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .history-row:last-child { border-bottom: none; }
  .history-row .d { color: var(--dim); }
  .empty-msg { font-size: 13px; color: var(--dim); text-align: center; padding: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>RunTracker</h1>

  <div class="card">
    <div class="stats">
      <div>
        <div class="stat-label">Time</div>
        <div class="stat-value" id="statTime">00:00</div>
      </div>
      <div>
        <div class="stat-label">Distance</div>
        <div class="stat-value" id="statDist">0.00<small> km</small></div>
      </div>
      <div>
        <div class="stat-label">Speed</div>
        <div class="stat-value" id="statSpeed">0.0<small> km/h</small></div>
      </div>
      <div>
        <div class="stat-label">Avg pace</div>
        <div class="stat-value" id="statPace">--<small> /km</small></div>
      </div>
    </div>
    <button id="toggle">Start run</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <div class="cal-head">
      <button id="prevMonth">&larr;</button>
      <div class="cal-title" id="calTitle"></div>
      <button id="nextMonth">&rarr;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="card">
    <div class="stat-label" style="margin-bottom:8px;">Recent runs</div>
    <div id="history"></div>
  </div>
</main>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "runtracker.runs";

  function loadRuns() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }
  function saveRuns(runs) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(runs));
  }

  function haversineMeters(lat1, lon1, lat2, lon2) {
    var R = 6371000;
    var toRad = function (d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLon = toRad(lon2 - lon1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function fmtTime(ms) {
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return h > 0 ? (pad(h) + ":" + pad(m) + ":" + pad(s)) : (pad(m) + ":" + pad(s));
  }

  function fmtPace(secPerKm) {
    if (!isFinite(secPerKm) || secPerKm <= 0) return "--";
    var m = Math.floor(secPerKm / 60);
    var s = Math.round(secPerKm % 60);
    if (s === 60) { m += 1; s = 0; }
    return m + ":" + String(s).padStart(2, "0");
  }

  function todayKey(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ---- run tracker state ----
  var running = false;
  var watchId = null;
  var startTime = null;
  var lastPos = null;
  var totalDistance = 0; // meters
  var currentSpeed = 0;  // m/s
  var tickTimer = null;

  var elToggle = document.getElementById("toggle");
  var elStatus = document.getElementById("status");
  var elTime = document.getElementById("statTime");
  var elDist = document.getElementById("statDist");
  var elSpeed = document.getElementById("statSpeed");
  var elPace = document.getElementById("statPace");

  function setStatus(msg, isError) {
    elStatus.textContent = msg || "";
    elStatus.className = isError ? "error" : "";
  }

  function render() {
    var elapsedMs = startTime ? (Date.now() - startTime) : 0;
    elTime.textContent = fmtTime(elapsedMs);
    elDist.textContent = (totalDistance / 1000).toFixed(2) + " km".replace(" km", "");
    elDist.innerHTML = (totalDistance / 1000).toFixed(2) + "<small> km</small>";
    elSpeed.innerHTML = (currentSpeed * 3.6).toFixed(1) + "<small> km/h</small>";
    var secPerKm = totalDistance > 0 ? (elapsedMs / 1000) / (totalDistance / 1000) : NaN;
    elPace.innerHTML = fmtPace(secPerKm) + "<small> /km</small>";
  }

  function onPosition(pos) {
    var c = pos.coords;
    if (lastPos) {
      var d = haversineMeters(lastPos.latitude, lastPos.longitude, c.latitude, c.longitude);
      // ignore GPS jitter under 1m
      if (d > 1) totalDistance += d;
    }
    currentSpeed = (typeof c.speed === "number" && c.speed !== null && c.speed >= 0) ? c.speed : currentSpeed;
    lastPos = c;
    setStatus("Tracking… accuracy ±" + Math.round(c.accuracy) + "m");
    render();
  }

  function onPositionError(err) {
    setStatus("GPS error: " + err.message, true);
  }

  function start() {
    if (!("geolocation" in navigator)) {
      setStatus("Geolocation not supported in this browser.", true);
      return;
    }
    running = true;
    startTime = Date.now();
    lastPos = null;
    totalDistance = 0;
    currentSpeed = 0;
    elToggle.textContent = "Stop run";
    elToggle.classList.add("running");
    setStatus("Waiting for GPS fix…");
    watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 15000
    });
    tickTimer = setInterval(render, 1000);
  }

  function stop() {
    running = false;
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    if (tickTimer) clearInterval(tickTimer);
    watchId = null;
    tickTimer = null;
    elToggle.textContent = "Start run";
    elToggle.classList.remove("running");

    var elapsedMs = startTime ? (Date.now() - startTime) : 0;
    if (elapsedMs > 3000 && totalDistance > 0) {
      var runs = loadRuns();
      runs.push({
        date: todayKey(),
        durationMs: elapsedMs,
        distanceM: totalDistance,
        avgPaceSecPerKm: (elapsedMs / 1000) / (totalDistance / 1000)
      });
      saveRuns(runs);
      setStatus("Run saved.");
      renderCalendar();
      renderHistory();
    } else {
      setStatus("Run too short, not saved.");
    }
    startTime = null;
  }

  elToggle.addEventListener("click", function () {
    if (running) stop(); else start();
  });

  // ---- calendar ----
  var calCursor = new Date();
  calCursor.setDate(1);

  function renderCalendar() {
    var runs = loadRuns();
    var ranDates = {};
    runs.forEach(function (r) { ranDates[r.date] = true; });

    var year = calCursor.getFullYear();
    var month = calCursor.getMonth();
    var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    document.getElementById("calTitle").textContent = monthNames[month] + " " + year;

    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";
    ["S","M","T","W","T","F","S"].forEach(function (d) {
      var el = document.createElement("div");
      el.className = "cal-dow";
      el.textContent = d;
      grid.appendChild(el);
    });

    var firstDay = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayStr = todayKey();

    for (var i = 0; i < firstDay; i++) {
      var pad = document.createElement("div");
      pad.className = "cal-day empty";
      grid.appendChild(pad);
    }
    for (var day = 1; day <= daysInMonth; day++) {
      var key = year + "-" + String(month + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      var el2 = document.createElement("div");
      el2.className = "cal-day" + (ranDates[key] ? " ran" : "") + (key === todayStr ? " today" : "");
      el2.textContent = day;
      grid.appendChild(el2);
    }
  }

  document.getElementById("prevMonth").addEventListener("click", function () {
    calCursor.setMonth(calCursor.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    calCursor.setMonth(calCursor.getMonth() + 1);
    renderCalendar();
  });

  // ---- history ----
  function renderHistory() {
    var runs = loadRuns().slice().reverse().slice(0, 10);
    var el = document.getElementById("history");
    if (runs.length === 0) {
      el.innerHTML = '<div class="empty-msg">No runs logged yet.</div>';
      return;
    }
    el.innerHTML = runs.map(function (r) {
      return '<div class="history-row"><span class="d">' + r.date + '</span>' +
        '<span>' + (r.distanceM / 1000).toFixed(2) + ' km · ' +
        fmtTime(r.durationMs) + ' · ' + fmtPace(r.avgPaceSecPerKm) + '/km</span></div>';
    }).join("");
  }

  render();
  renderCalendar();
  renderHistory();
})();
</script>
</body>
</html>
